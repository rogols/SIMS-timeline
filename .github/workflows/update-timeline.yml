name: Update course timeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  TIMEEDIT_ICS_URL: >-
    https://cloud.timeedit.net/miun/web/student/ri61166650000YQQ41Z6501001y5Y492Xg10g3X9Y65Z9216082QXXX395861417271X1X602577133151181936XX21450911X69616kZl4Z116369wn0Qo62tnZ4n7t01okd64kjQu6Q50Z5l1EQA8DD43A5461AC25C56270504E27BDC8.ics

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.7"
          cache: "pip"

      - name: Install renderer dependency
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Generate current timeline
        run: python generate_timeline.py --output timeline.png

      - name: Commit timeline only when changed
        shell: bash
        run: |
          if git diff --quiet -- timeline.png; then
            echo "timeline.png is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.png
          git commit -m "Update course timeline for $(TZ=Europe/Stockholm date +%F)"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir _site
          cp index.html timeline.png _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
